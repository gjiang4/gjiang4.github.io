<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>語言視圖 · Language Views</title>
<style>
:root{--bg:#0b0d12;--card:#161a22;--ink:#eef1f5;--mut:#9aa3af;--line:#242a35;--gold:#ffce5c}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(1100px 560px at 50% -10%,#1a2336,#0b0d12);
  color:var(--ink);
  font:17px/1.55 -apple-system,BlinkMacSystemFont,"PingFang TC","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  min-height:100vh;display:flex;justify-content:center;padding:46px 18px 60px}
.wrap{max-width:560px;width:100%}
h1{font-size:26px;margin:0 0 6px;letter-spacing:-.3px}
.tag{color:var(--mut);font-size:14px;margin:0 0 8px}
.tag-en{color:#6f7886;font-size:12.5px;margin:0 0 30px}
a.card{display:block;text-decoration:none;color:var(--ink);background:var(--card);
  border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:14px}
a.card:hover,a.card:focus-visible{border-color:var(--gold);outline:none}
a.card b{display:block;font-size:18px;margin-bottom:5px;letter-spacing:-.2px}
a.card span{display:block;color:var(--mut);font-size:14px;line-height:1.45}
a.card .meta{color:#6f7886;font-size:12px;margin-top:9px;letter-spacing:.04em}
.note{color:#6f7886;font-size:12.5px;line-height:1.6;margin-top:28px;
  border-top:1px solid var(--line);padding-top:16px}
</style>
</head><body>
<div class="wrap">
  <h1>語言視圖</h1>
  <p class="tag">中英對照，可聽可讀。點任何一行播放。</p>
  <p class="tag-en">Language Views. Bilingual, read and listen, tap any line to play.</p>

  <a class="card" href="listening-series-reflection/">
    <b>聽力測驗系列：這不只是聽力測驗</b>
    <span>The listening test is not a listening test. 為什麼這個格式是開放的，怎麼先廣招人再篩出同類，以及它為什麼真的可以在任何地方拍。</span>
    <span class="meta">7 節 · 2026-08-10</span>
  </a>

  <p class="note">
    快捷鍵：k 下一段，j 上一段，空白鍵播放或暫停。<br>
    Hotkeys: k next, j back, space play/pause.
  </p>
</div>
</body></html>
